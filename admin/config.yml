backend:
  name: git-gateway
  branch: main

logo_url: /images/New Logo Design 4 Transparent.png

media_folder: "images"
public_folder: "/images"

# What teachers see in the left sidebar — keep these names simple and action-oriented
collections:

  # ── KEY DATES & SCHOOL YEAR ───────────────────────────────────────────────────
  - name: "site-settings"
    label: "🗓️ Key Dates & School Year"
    description: "One place to update the school year and admissions dates shown across the whole website — banners, supply lists, and Admissions/Enrollment pages. Change it here once and it updates everywhere — no need to hunt through pages."
    files:

      - name: "site_settings"
        label: "Key Dates & School Year"
        file: "_data/site-settings.json"
        fields:

          - label: "Current School Year"
            name: "currentSchoolYear"
            widget: "string"
            hint: "The school year currently in session. Shown on the Re-Enrollment banner and the Supply List page. Example: 2025–2026"

          - label: "Upcoming Enrollment Year"
            name: "enrollmentYear"
            widget: "string"
            hint: "The school year new families are applying for. Shown on the Admissions & Enrollment pages. Example: 2026–2027"

          - label: "Open House Date"
            name: "openHouseDate"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            picker_utc: true
            hint: "The date of the school's Open House event. Updates the Events page, Tuition page, and Admissions Key Dates automatically."

          - label: "New Student Applications Open Date"
            name: "enrollmentOpenDate"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            picker_utc: true
            hint: "The date new-student applications open. Updates the Admissions pages automatically."

          - label: "Re-Enrollment Open Date"
            name: "reenrollmentOpenDate"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            picker_utc: true
            hint: "The date re-enrollment opens for currently enrolled, returning students. Updates the Tuition, Events, and Key Dates pages automatically."

  # ── BANNERS ──────────────────────────────────────────────────────────────────
  - name: "banners"
    label: "📢 Banners & Announcements"
    description: "Turn banners on or off and update their text. Changes go live within about 30 seconds after you click Publish. (The school year shown on the banner is now controlled from 🗓️ Key Dates & School Year.)"
    files:

      - name: "reenrollment"
        label: "Re-Enrollment Banner"
        file: "_data/banner.json"
        fields:

          - label: "Show this banner on the website?"
            name: "active"
            widget: "boolean"
            default: false
            hint: "✅ ON = banner is visible to families. ❌ OFF = banner is hidden. Remember to click Publish after changing."

          - label: "Banner Headline"
            name: "headline"
            widget: "string"
            hint: "The big bold text families see first. Example: Re-Enrollment is Now Open"

          - label: "Banner Description"
            name: "description"
            widget: "text"
            hint: "1–2 sentences explaining what families should do."

          - label: "Deadline Date"
            name: "deadline"
            widget: "string"
            hint: "Just the date as text. Example: March 31  or  April 15, 2026"

          - label: "Button Text"
            name: "buttonText"
            widget: "string"
            hint: "The text on the button families click. Example: Re-Enroll Now →"

          - label: "Button Link (URL)"
            name: "buttonLink"
            widget: "string"
            hint: "Where the button takes families. Use the FACTS portal link or leave as-is."

  # ── SUPPLY LISTS ─────────────────────────────────────────────────────────────
  - name: "supply-list"
    label: "🎒 Supply Lists"
    description: "Update the classroom supply list each summer. You can add, remove, or edit items for any grade. (The school year shown on this page is now controlled from 🗓️ Key Dates & School Year.)"
    files:

      - name: "supply_list"
        label: "Classroom Supply Lists"
        file: "_data/supply-list.json"
        fields:

          - label: "Grades"
            name: "grades"
            widget: "list"
            label_singular: "Grade"
            summary: "{{fields.label}}"
            hint: "Each grade has its own list. Click a grade to expand and edit it. Use the handles (⠿) to reorder grades."
            fields:

              - label: "Grade Name"
                name: "label"
                widget: "string"
                hint: "How it appears on the website. Example: 3rd Grade  or  Kindergarten"

              - label: "Teacher Note (optional)"
                name: "note"
                widget: "string"
                required: false
                hint: "Optional note shown under the grade name, e.g. 'Mrs. Dews may send home additional items the first week.'"

              - label: "Supply Items"
                name: "items"
                widget: "list"
                label_singular: "Item"
                hint: "One supply item per line. Click '+ Add Item' to add more. Drag to reorder."

  # ── STAFF DIRECTORY ──────────────────────────────────────────────────────────
  - name: "staff"
    label: "👩‍🏫 Staff Directory"
    description: "Add, remove, or update staff members. Changes appear on both the Faculty & Staff page and the Current Families contact directory."
    files:

      - name: "staff_list"
        label: "Faculty & Staff"
        file: "_data/staff.json"
        fields:

          - label: "Staff Members"
            name: "staff"
            widget: "list"
            label_singular: "Staff Member"
            summary: "{{fields.name}} — {{fields.role}}"
            hint: "Each person on staff. Click a name to edit. Drag to reorder."
            fields:

              - label: "Full Name"
                name: "name"
                widget: "string"
                hint: "e.g. Amanda Dews  or  Mr. Penry"

              - label: "Role / Title"
                name: "role"
                widget: "string"
                hint: "e.g. Kindergarten Teacher  or  Principal · 7–8th Grade Math"

              - label: "Section"
                name: "section"
                widget: "select"
                hint: "Which group this person appears under on the Faculty & Staff page."
                options:
                  - { label: "Administration", value: "Administration" }
                  - { label: "Preschool", value: "Preschool" }
                  - { label: "Kindergarten & Grades 1–4", value: "Kindergarten & Grades 1–4" }
                  - { label: "Grades 5–8", value: "Grades 5–8" }
                  - { label: "Specialists & Support", value: "Specialists & Support" }

              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Upload a headshot photo. Square or portrait works best."

              - label: "Email Address"
                name: "email"
                widget: "string"
                required: false
                hint: "Staff email. Leave blank if not applicable."

              - label: "Short Bio (optional)"
                name: "bio"
                widget: "text"
                required: false
                hint: "1–2 sentences shown on the Faculty & Staff page. Only needed for Administration staff."

              - label: "Show in Family Contact Directory?"
                name: "showInDirectory"
                widget: "boolean"
                default: true
                hint: "✅ ON = appears in the Current Families email directory. Turn OFF for aides and support roles that families don't contact directly."
