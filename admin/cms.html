  <style>
    /* Recolor the editor's gray list-item boxes to match the site's purple.
       Decap CMS generates a random hash prefix on its CSS classes that changes
       between versions, but the descriptive suffix (e.g. "NestedObjectLabel")
       stays stable, so we match on that instead of the full class name. */
    [class*="NestedObjectLabel"] {
      background-color: rgba(61, 20, 114, 0.10) !important;
    }
  </style>
</head>
