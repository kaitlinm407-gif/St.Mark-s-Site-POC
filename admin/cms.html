<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. Mark's — Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Recolor the editor's gray list-item boxes to match the site's purple.
       Decap CMS generates a random hash prefix on its CSS classes that changes
       between versions, but the descriptive suffix (e.g. "NestedObjectLabel")
       stays stable, so we match on that instead of the full class name. */
    [class*="NestedObjectLabel"] {
      background-color: rgba(61, 20, 114, 0.10) !important;
    }

    .dash-back-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #3D1472 0%, #5A2A9E 100%);
      color: #fff;
      font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 20px 12px 16px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(61,20,114,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .dash-back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(61,20,114,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .dash-back-btn svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <a href="index.html" class="dash-back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Dashboard
  </a>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
