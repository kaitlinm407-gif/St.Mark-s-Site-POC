[build]
  publish = "."

# Prevent the browser and CDN from caching data files
# so CMS changes go live immediately after publishing
[[headers]]
  for = "/_data/*"
    [headers.values]
      Cache-Control = "no-cache, no-store, must-revalidate"

# Let browsers cache images long-term so repeat visitors don't
# re-download them on every visit (cuts bandwidth significantly)
[[headers]]
  for = "/images/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000"
